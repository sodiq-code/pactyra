[package]
name = "reference-treasury"
version = "0.1.0"
description = "Reference treasury enforcing capabilities before transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reference_treasury"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test-sbf = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
